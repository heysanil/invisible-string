name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

# Least privilege at the workflow level; each job widens only what it needs.
permissions:
  contents: read

# cancel-in-progress is spelled out rather than left to the default: a release
# run pushes a tag and cuts a GitHub Release, and a later edit that flips this
# on would silently preempt one mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains the `chore(release): version packages` PR; when that PR merges,
  # tags the release and cuts its GitHub Release. Tag and image build happen in
  # ONE run on purpose: a tag pushed with GITHUB_TOKEN cannot trigger another
  # workflow, so splitting them would need a PAT.
  version:
    name: Version and tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 15
    # contents: write — push the version branch, the release tag, and the
    # GitHub Release. pull-requests: write — open the version PR.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # fetch-depth: 0 also fetches tags, which release:tag needs to decide
      # whether this version was already released.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the pinned host toolchain from mise.toml (bun, node, …) and
      # puts mise's shims on PATH, so the bare `bun` calls below are those
      # exact versions — no `mise exec` wrapper needed.
      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately NOT changesets/action@v1, which is unusable here on two
      # counts (both read out of its source at tag v1):
      #
      #  1. `runVersion` reads a per-package CHANGELOG.md for every changed
      #     package with no ENOENT guard (src/run.ts:319-334). Our config sets
      #     `changelog: false`, so those files never exist and the job would
      #     crash before ever opening the PR. The identical read at
      #     src/run.ts:31-41 IS guarded ("if we can't find a changelog, the
      #     user has probably disabled changelogs") — their issue #569, closed
      #     as a duplicate, never fixed.
      #  2. `Git.prepareBranch` (src/git.ts:94-101) checks out
      #     changeset-release/main and never switches back, so `release:tag`
      #     below would run on the version branch: it would tag the UNMERGED
      #     bump commit and build images from pre-bump source, and the real
      #     release commit would later no-op as "already released".
      #
      # Hence the final `git checkout --force "$GITHUB_SHA"`, on every path —
      # release:tag must observe main's state, never the version branch's.
      - name: Version packages and maintain the version PR
        run: |
          set -euo pipefail

          # Also required later for release:tag's annotated tag — do not move
          # this into the tag step.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          bun run release:version

          # --porcelain, not `git diff --quiet`: release:version DELETES the
          # consumed .changeset/*.md files and may create CHANGELOG.md, and the
          # commit below is `git add -A`.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to version — leaving $BRANCH alone."
          else
            git add -A
            git commit -m "chore(release): version packages"
            git push -f origin "$BRANCH"

            # Rendered once and applied on BOTH arms below. The force-push just
            # changed what the PR proposes, so a body left at its original text
            # would keep naming the old version the moment a later changeset
            # moves the bump.
            body="$RUNNER_TEMP/version-pr-body.md"
            bun run scripts/release-pr-body.ts "$body"

            # --state open, not `gh pr view`: that matches merged PRs too, and
            # a stale match would mean the next release never opens a PR.
            open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
            if [ -n "$open" ]; then
              gh pr edit "$open" --body-file "$body"
              echo "Updated PR #$open for $BRANCH."
            else
              gh pr create --base main --head "$BRANCH" \
                --title "chore(release): version packages" \
                --body-file "$body"
            fi
          fi

          git checkout --force "$GITHUB_SHA"
        env:
          BRANCH: changeset-release/main
          GH_TOKEN: ${{ github.token }}

      - name: Tag and release
        id: tag
        run: bun run release:tag
        env:
          GH_TOKEN: ${{ github.token }}

  images:
    name: Build and push images
    needs: [version]
    # `!cancelled()` (not `always()`) so the tag-push path still runs when
    # `version` is SKIPPED, while a cancelled run does not publish images, and a
    # FAILED version job leaves both disjuncts false so this correctly skips.
    # The ${{ }} wrapper is mandatory: a bare leading `!` is a YAML tag
    # indicator and the file would not parse.
    if: ${{ !cancelled() && (needs.version.outputs.released == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: control-plane
            dockerfile: infra/docker/control-plane.Dockerfile
          - name: worker
            dockerfile: infra/docker/worker.Dockerfile
          - name: web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      # No setup-buildx-action: Namespace runners come pre-configured with
      # remote builders, and stock buildx setup would override that. Layer
      # cache persists builder-side, so no cache-from/cache-to either.
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On the release path the ref is `main`, so github.ref_name would publish
      # `…-web:main`. A skipped job's outputs are empty strings, and '' is
      # falsy, so the fallback resolves correctly on the tag-push path.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/heysanil/invisible-string-${{ matrix.name }}:${{ needs.version.outputs.version || github.ref_name }}
            ghcr.io/heysanil/invisible-string-${{ matrix.name }}:${{ github.sha }}
