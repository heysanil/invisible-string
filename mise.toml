# Host toolchain pins — the single source of truth for the tools every lane
# runs ON. CI installs exactly this via `jdx/mise-action@v4` (no `install_args`:
# the action reads this file); locally, `mise trust && mise install` reproduces
# it. Pins are EXACT, per AGENTS.md.
#
# What this file does NOT own:
#   - the versions baked INTO generated agent projects — packages/compiler/
#     versions.json owns eve / ai / @workflow/* / zod / typescript, and is
#     hashed into the artifact content hash.
#   - the production images — infra/docker/*.Dockerfile bake their own bare
#     node + `oven/bun` base and deliberately carry NO mise (the build steps
#     and worker resolve a node binary directly; see AGENTS.md).
#
# `node` below is DERIVED from versions.json, and the bun major.minor must
# match the Dockerfiles' `oven/bun` tag. Both are guarded, ungated, by
# tests/integration/toolchain-pins.test.ts.
#
# In CI the action sets MISE_TRUSTED_CONFIG_PATHS + MISE_YES and puts mise's
# shims on PATH, so bare `bun` / `node` / `npm` / `wrangler` in a `run:` step
# are already these versions — no `mise exec` wrapper needed. Prefer
# config-driven forms (`mise install`, `mise where node`) over fuzzy ones
# (`node@24`): a fuzzy request resolves to the newest matching release, which
# would install a node this file did not pin and win the "newest installed
# 24.x" race in resolveNodeBinDir()/resolveNodeBin().

[tools]
# Runs the platform: control-plane, worker, web + site tooling, every test lane.
bun = "1.3.14"

# Runs everything eve: `eve build` during a publish, and the compiled agent
# processes the worker boots. eve's engines check refuses Node < 24.
# Keep EXACTLY equal to packages/compiler/versions.json `node`.
node = "24.19.0"

# Cloudflare deploys for apps/site (.github/workflows/site.yml). The npm
# backend installs into mise's own dir (~/.local/share/mise/installs/
# npm-wrangler/<version>), never into apps/site — npm cannot parse Bun's
# `workspace:*` protocol in that manifest, which is why this is NOT
# cloudflare/wrangler-action (its npm fallback installs in-project).
"npm:wrangler" = "4.110.0"
